# Registre des mécaniques — source de vérité de la couverture.
# statut : absent | modelise | teste | valide-journal | valide-jeu
# certitude : certain | probable | suppose ; forever : oui | modifie | inconnu
# certitude : porte sur la règle (sa forme dans Forever), pas sur ses valeurs ; les valeurs ont leur propre
#   certitude (forever/data/<version>/sources.json, mechanics.json) et la provenance affiche le minimum des deux.
#   Une règle Classic supposée inchangée reste au mieux `suppose` tant qu'elle n'a pas été observée dans Forever.
# tests : références `tests/…/fichier.py::test_nom` (fonction existante) ; `teste` ou mieux en exige au moins une.
# formule (optionnelle) : symbolique, seuls 0 et 1 y sont admis ; les valeurs vivent dans forever/data/<version>/.
# note (optionnelle) : périmètre couvert, reprise prévue.
