# Catalogue court de macros par classe (EX1, décision 267) : clés de sorts de classes.json seulement, aucun chiffre.
# Modèles (forever/exports/macros.py) : help (soin ou buff sur la cible survolée, sinon la cible), focus (contrôle sur
# la focalisation, sinon la cible), interrupt (/stopcasting puis le sort), melee (/startattack puis le sort).
# Une macro n'est rendue que si son sort est appris au niveau du personnage (rangs de classes.json ; un sort de
# talent seulement si le talent est pris). Utilité des macros : choix de catalogue, certitude suppose.
Warrior:
  - {template: melee, spell: heroicStrike}
  - {template: melee, spell: sunderArmor}
  - {template: interrupt, spell: pummel}
  - {template: interrupt, spell: shieldBash}
  - {template: focus, spell: disarm}
Paladin:
  - {template: help, spell: holyLight}
  - {template: help, spell: flashOfLight}
  - {template: help, spell: blessingOfMight}
  - {template: help, spell: purify}
  - {template: focus, spell: hammerOfJustice}
  - {template: melee, spell: holyStrike}
