# Sorts d'un rôle par classe pour les profils EllesmereUI (EX1, bloc F, décision 267) : clés de sorts de classes.json
# seulement, aucun chiffre. Rôles tenus par chaque classe : table des spécialisations de docs/SPEC.md.
# cooldowns et utility : barres du gestionnaire de recharges (un sort n'y entre que s'il a une recharge plus longue
# que le temps de recharge global de son rang) ; buffs : rappels de buffs (customIDs). Un sort n'est rendu que s'il
# est appris au niveau (rangs de classes.json ; sort de talent : seulement si le talent est pris).
# Choix de catalogue : certitude suppose.
Warrior:
  dps:
    cooldowns: [recklessness, deathWish, sweepingStrikes, bloodrage, berserkerRage]
    utility: [charge, intercept, intimidatingShout, pummel, disarm]
    buffs: [battleShout]
  tank:
